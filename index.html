<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="黃泉雨 YOMIAME，NickHuang Studio 開發的武士動作遊戲。">
  <title>黃泉雨 YOMIAME</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101820; color: #f2eee6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, main, footer { width: min(100% - 3rem, 68rem); margin-inline: auto; }
    header { padding-block: 2rem; color: #cbb88c; font-size: .9rem; letter-spacing: .08em; }
    main { flex: 1; display: grid; align-content: center; padding-block: 5rem; }
    .name { color: #cbb88c; letter-spacing: .22em; font-size: 1rem; }
    h1 { font-family: "Songti TC", "Noto Serif TC", serif; font-size: clamp(3.5rem, 14vw, 7rem); font-weight: 500; letter-spacing: .12em; line-height: 1.3; margin: 1rem 0 2rem; }
    p { font-size: 1.125rem; line-height: 1.9; max-width: 36rem; color: #c5cbd0; }
    a { color: #e3cf9b; text-underline-offset: .25em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 1.5rem; }
    footer { padding-block: 2rem; color: #a7b0b7; font-size: .875rem; }
  </style>
</head>
<body>
  <header>NickHuang Studio</header>
  <main>
    <div class="name">YOMIAME</div>
    <h1>黃泉雨</h1>
    <p>在雨中的村落拔刀迎戰，掌握斬擊、招架與閃避的時機，逐波選擇能力，挑戰雨夜村落與竹林參道。</p>
    <p>iOS 版本正準備上架；如需遊戲操作、進度或問題回報協助，請使用下方聯絡方式。</p>
    <nav aria-label="網站連結">
      <a href="./privacy/">隱私權政策 Privacy Policy</a>
      <a href="mailto:warhammerlieutenant@gmail.com">聯絡我們</a>
    </nav>
  </main>
  <footer>© 2026 NickHuang Studio</footer>
</body>
</html>
